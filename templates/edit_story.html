{% extends 'base.html' %}{% block content %}<section class="admin-head"><div class="wrap"><div><div class="eyebrow">STORY WORKBENCH</div><h1>{{item.title if item else 'Create a new story'}}</h1></div><a class="button secondary" href="{{url_for('dashboard')}}">Back to Desk</a></div></section><section class="wrap narrow admin-section"><form method="post" class="form-grid"><label class="wide">Headline<input name="title" required value="{{item.title if item else ''}}"></label><label class="wide">URL slug<input name="slug" value="{{item.slug if item else ''}}"></label><label class="wide">Deck<textarea name="deck" rows="3">{{item.deck if item else ''}}</textarea></label><label class="wide">Article body<textarea name="body" rows="18" required>{{item.body if item else ''}}</textarea></label><label>Section<select name="category">{% for c in CATEGORIES %}<option {% if item and item.category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label><label>Byline<input name="author" value="{{item.author if item else 'Editorial Desk'}}"></label><label class="wide">President tags<input name="president_tags" value="{{item.president_tags if item else ''}}"></label><label class="wide">Topic tags<input name="topic_tags" value="{{item.topic_tags if item else ''}}"></label><label class="wide">Source and verification notes<textarea name="source_notes" rows="5">{{item.source_notes if item else ''}}</textarea></label><label>Fact check<select name="fact_check_status">{% for x in ['Pending','In Progress','Verified','Contested','Needs Correction'] %}<option {% if item and item.fact_check_status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Rights<select name="rights_status">{% for x in ['Pending','Certified by contributor','Cleared','Restricted','Denied'] %}<option {% if item and item.rights_status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Publication<select name="publication_status">{% for x in ['Draft','Approved','Scheduled','Published','Archived'] %}<option {% if item and item.publication_status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Publish date<input type="datetime-local" name="published_at" value="{{item.published_at[:16] if item and item.published_at else ''}}"></label><label class="wide check"><input type="checkbox" name="featured" value="yes" {% if item and item.featured %}checked{% endif %}><span>Feature on newsroom homepage</span></label><div class="wide"><button class="button">Save Story</button>{% if item and item.publication_status=='Published' %} <a class="button secondary" href="{{url_for('story',slug=item.slug)}}">Public View</a>{% endif %}</div></form></section>{% endblock %}
