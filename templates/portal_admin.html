{% extends 'base.html' %}{% block content %}<section class="admin-head"><div class="wrap"><div><div class="eyebrow">PORTAL ADMINISTRATION</div><h1>Add {{mode|title}}</h1></div><a class="button secondary" href="{{url_for('portal_home')}}">Back</a></div></section><section class="wrap narrow section"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% if mode=='member' %}<label class="wide">Full name<input name="full_name" required></label><label>Email for portal login<input type="email" name="email"></label><label>Temporary password<input type="password" name="password"></label><label class="wide">Presidential connection<input name="presidential_connection"></label><label class="wide">Biography<textarea name="biography"></textarea></label><label>City<input name="city"></label><label>State<input name="state"></label><label>Committee<input name="committee"></label><label>Visibility<select name="visibility"><option>Members</option><option>Public</option><option>Private</option></select></label>{% elif mode=='event' %}<label class="wide">Title<input name="title" required></label><label>Starts<input type="datetime-local" name="starts_at" required></label><label>Ends<input type="datetime-local" name="ends_at"></label><label class="wide">Location<input name="location"></label><label class="wide">Description<textarea name="description"></textarea></label><label class="wide">Registration URL<input name="registration_url"></label>{% else %}<label class="wide">Title<input name="title" required></label><label class="wide">Description<textarea name="description"></textarea></label><label>Category<input name="category" value="Governance"></label><label class="wide">Document URL<input name="file_url"></label>{% endif %}<div class="wide"><button class="button">Save</button></div></form></section>{% endblock %}
