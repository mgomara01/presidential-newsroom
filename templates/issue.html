{% extends 'base.html' %}{% block title %}{{issue.title}}{% endblock %}{% block content %}<section class="issue-cover"><div class="wrap"><div class="eyebrow">MONTHLY EDITION · {{issue.issue_month}}</div><h1>{{issue.title}}</h1><p>{{issue.editor_note}}</p></div></section><section class="wrap section"><div class="toc">{% for s in stories %}<article><div class="number">{{'%02d'|format(loop.index)}}</div><div><div class="eyebrow">{{s.section_name}}</div><h2><a href="{{url_for('story',slug=s.slug)}}">{{s.title}}</a></h2><p>{{s.deck}}</p></div></article>{% endfor %}</div></section>{% endblock %}
